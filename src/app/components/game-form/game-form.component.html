<div class="game-form-container">
  <h2>{{ game ? 'Edit Game' : 'Add New Game' }}</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="gameName">Game Name</label>
      <input
        type="text"
        id="gameName"
        [(ngModel)]="gameName"
        name="gameName"
        placeholder="Enter game name"
        required
        class="form-control">
    </div>

    <div class="form-group">
      <label for="platform">Platform</label>
      <select
        id="platform"
        [(ngModel)]="selectedPlatform"
        name="platform"
        required
        class="form-control">
        <option *ngFor="let platform of platforms" [value]="platform">
          {{ platform }}
        </option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-save" [disabled]="!gameName.trim()">
        {{ game ? 'Update' : 'Add' }}
      </button>
      <button type="button" class="btn btn-cancel" (click)="onCancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
